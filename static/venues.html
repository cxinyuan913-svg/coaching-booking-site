<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>上課場地 - Raymond 羽球教室</title>
  <meta name="description" content="Raymond 羽球教室在新北、新竹的合作羽球館與地址。" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Venue</span>
        <h1>上課場地</h1>
        <p>主要在新北、新竹兩地上課，各自都有合作的羽球館，實際地點會依報名狀況與你確認。</p>
      </div>
    </section>

    <!-- 上課場地：不只固定兩間，按地區列出實際合作的場館，避免讓人以為只能約這兩處 -->
    <section class="section" id="venue">
      <div class="container">
        <div class="grid-12">
          <div class="venue-card card">
            <div class="venue-card-photo"><img src="/static/img/venue-taipei.jpg" alt="新北市上課場地" /></div>
            <div class="venue-card-body">
              <h3>新北市（泰山／三重／蘆洲）</h3>
              <p>
                快羽會館 —
                <a href="https://www.google.com/maps/search/?api=1&query=快羽會館%20新北市泰山區楓樹里文化街53號" target="_blank" rel="noopener">243094 新北市泰山區楓樹里文化街53號</a>
              </p>
              <p class="venue-card-meta">也常合作場館：森域羽球運動會館、三蘆羽球館、海龍王羽球學苑</p>
            </div>
          </div>
          <div class="venue-card card">
            <div class="venue-card-photo"><img src="/static/img/venue-hsinchu.jpg" alt="新竹縣上課場地" /></div>
            <div class="venue-card-body">
              <h3>新竹縣（寶山鄉）</h3>
              <p>
                動智AI 羽球竹科館 —
                <a href="https://www.google.com/maps/search/?api=1&query=動智AI羽球竹科館%20新竹縣寶山鄉大崎村雙園路二段32-1號" target="_blank" rel="noopener">308 新竹縣寶山鄉大崎村雙園路二段32-1號</a>
              </p>
              <p class="venue-card-meta">也常合作場館：晴天羽球館</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="/static/js/common.js"></script>
</body>
</html>
