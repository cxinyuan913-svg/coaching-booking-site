<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>教練預約網站</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <main>
    <!--
      這整頁都是佔位內容（用【】標起來），還沒放教練真實的介紹跟照片。
      等內容確定後，把下面標記的地方換成真的文字/圖片即可，版面不用動。
    -->
    <section class="hero">
      <div class="hero-avatar-placeholder">照片</div>
      <h1>【教練姓名】</h1>
      <p class="hero-tagline">【一句話招牌介紹，例如：陪你從零基礎打到能上場比賽】</p>
      <a href="/book.html" class="cta-button">立即預約</a>
    </section>

    <section class="section-block">
      <h2>關於教練</h2>
      <p>
        【自我介紹：教學經歷、教學風格、為什麼想教球……這段是佔位文字，
        請換成真實內容。】
      </p>
    </section>

    <section class="section-block">
      <h2>教學亮點</h2>
      <ul class="highlight-list">
        <li>【例如：X 年教學經驗】</li>
        <li>【例如：OO 協會認證教練】</li>
        <li>【例如：帶過從新手到能上場比賽的學生】</li>
      </ul>
    </section>

    <section class="section-block" style="text-align: center">
      <a href="/book.html" class="cta-button">查看開放時段</a>
    </section>
  </main>

  <script src="/static/js/common.js"></script>
</body>
</html>
