<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>課程介紹 - Raymond 羽球教室</title>
  <meta name="description" content="Raymond 羽球教室課程介紹與上課流程。" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Course</span>
        <h1>課程介紹</h1>
        <p>不管是新手入門還是準備比賽，都可以從一堂體驗課開始，教練會依你的程度安排訓練內容。</p>
      </div>
    </section>

    <section class="section on-paper-2" id="course">
      <div class="container">
        <div class="grid-12 course-grid" id="course-grid" style="margin-top: 0">
          <p style="color: var(--ink-3)">課程資料載入中…</p>
        </div>
      </div>
    </section>

    <!-- 上課流程：4 步驟 -->
    <section class="section" id="process">
      <div class="container">
        <span class="eyebrow">Process</span>
        <h2>上課流程</h2>
        <div class="grid-12" style="margin-top: 24px">
          <div class="process-step">
            <span class="process-step-number">01</span>
            <h3>線上預約</h3>
            <p>選課程、日期、時段，填寫目前程度與想加強的地方。</p>
          </div>
          <div class="process-step">
            <span class="process-step-number">02</span>
            <h3>教練確認</h3>
            <p>依你的程度與需求確認上課內容，1 個工作天內回覆。</p>
          </div>
          <div class="process-step">
            <span class="process-step-number">03</span>
            <h3>準時上場</h3>
            <p>到約定場地上課，教練全程依現場狀況調整訓練菜單。</p>
          </div>
          <div class="process-step">
            <span class="process-step-number">04</span>
            <h3>持續進步</h3>
            <p>上完課可再預約下一堂，逐步安排屬於你的訓練節奏。</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/courses.js"></script>
</body>
</html>
