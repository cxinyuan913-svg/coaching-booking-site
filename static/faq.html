<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>常見問題 - Raymond 羽球教室</title>
  <meta name="description" content="Raymond 羽球教室上課的常見問題。" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <nav class="topnav" id="topnav"></nav>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">FAQ</span>
        <h1>常見問題</h1>
        <p>上課前想知道的事，這裡整理了最常被問到的問題；沒找到答案的話歡迎直接用 LINE 詢問。</p>
      </div>
    </section>

    <!-- FAQ -->
    <section class="section on-paper-2" id="faq">
      <div class="container" style="max-width: 800px">
        <details class="faq-item">
          <summary>完全沒有基礎可以上課嗎？</summary>
          <p>可以，第一堂體驗課會先了解你的狀況，從最基本的動作開始教起。</p>
        </details>
        <details class="faq-item">
          <summary>需要自備球拍、羽球嗎？</summary>
          <p>建議自備球拍；羽球部分請上課前跟教練確認，一般會協調共同分攤。</p>
        </details>
        <details class="faq-item">
          <summary>可以取消或改期嗎？</summary>
          <p>可以，請盡早透過 LINE 或「我的預約」聯繫教練協調新時段。</p>
        </details>
        <details class="faq-item">
          <summary>可以兩人以上一起上課嗎？</summary>
          <p>可以，預約時在備註或聯絡教練說明人數，會依人數調整訓練菜單。</p>
        </details>
        <details class="faq-item">
          <summary>上課地點在哪裡？</summary>
          <p>主要在新北、新竹兩地的合作羽球館上課，詳見<a href="/venues.html">上課場地</a>頁，實際地點會依報名狀況確認，也可以另外約定。</p>
        </details>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="/static/js/common.js"></script>
</body>
</html>
